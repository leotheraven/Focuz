name: Build Focuz IPA
on:
  workflow_dispatch:
    inputs:
      run_simulator:
        description: 'Run the slower iPhone simulator screenshot check'
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    paths:
      - 'MamHabit/**'
      - 'MamHabit.xcodeproj/**'
      - 'FocuzLiveActivity/**'
      - 'Tests/**'
      - 'scripts/**'
      - '.github/workflows/build-ipa.yml'
permissions:
  contents: read
concurrency:
  group: mam-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test reward and habit logic
        run: bash scripts/test-engine.sh
      - name: Test local storage and backup recovery
        run: bash scripts/test-store.sh
      - name: Build unsigned iPhone IPA
        run: bash scripts/build-ipa.sh
      - name: Package source
        run: |
          zip -qr dist/Focuz-Source.zip MamHabit FocuzLiveActivity MamHabit.xcodeproj android Tests scripts README.md ARTWORK.md .github .gitignore
      - uses: actions/upload-artifact@v4
        with:
          name: Focuz-unsigned-IPA
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.run_simulator
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test iPhone simulator
        run: |
          mkdir -p dist
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project MamHabit.xcodeproj -scheme MamHabit -configuration Debug -destination "id=$DEVICE" -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build > simulator-build.log
          xcrun simctl install "$DEVICE" simbuild/Build/Products/Debug-iphonesimulator/MamHabit.app
          swiftc scripts/check-screenshot.swift -o /tmp/check-focuz-screen
          READY=0
          for ATTEMPT in 1 2 3; do
            xcrun simctl terminate "$DEVICE" com.mamhabit.personal || true
            xcrun simctl launch "$DEVICE" com.mamhabit.personal
            sleep 8
            xcrun simctl io "$DEVICE" screenshot dist/Focuz-iPhone.png
            if /tmp/check-focuz-screen dist/Focuz-iPhone.png; then READY=1; break; fi
          done
          test "$READY" = 1
          xcrun simctl terminate "$DEVICE" com.mamhabit.personal
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE" com.mamhabit.personal data)
          python3 scripts/preview-state.py "$APP_DATA/Library/Application Support/MamHabit/state.json"
          xcrun simctl launch "$DEVICE" com.mamhabit.personal
          sleep 3
          xcrun simctl io "$DEVICE" screenshot dist/Focuz-iPhone-Garden.png
          /tmp/check-focuz-screen dist/Focuz-iPhone-Garden.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Focuz-simulator-previews
          path: |
            dist/*.png
            simulator-build.log
          if-no-files-found: warn
          retention-days: 14
